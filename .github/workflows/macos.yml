name: macos
# The full test suite on macOS, on demand only (Actions → macos → Run workflow). It is kept off pushes and pull requests
# because GitHub's macOS runners are often not assigned in time, and a cancelled job would mark the commit as failed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/ci.yml
    with:
      os: '["macos-15"]'
      differential: "no"
