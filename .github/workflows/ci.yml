name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # run by macos.yml with another runner
    inputs:
      os:
        description: JSON list of runner labels for the test matrix
        type: string
        default: '["ubuntu-latest"]'
      differential:
        description: Run the Anchor differential job ("yes" or "no")
        type: string
        default: "yes"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests test on Ubuntu; macOS runs on demand from macos.yml (its runners are often unavailable,
        # and a cancelled job marks the commit as failed).
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest"]') }}
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Cache Agave CLI and platform-tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: agave-3.1.10-tools-${{ runner.os }}
      - name: Install Agave CLI
        run: |
          [ -x ~/.local/share/solana/install/active_release/bin/solana ] || sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install platform-tools (the clang TypeSOL compiles with)
        run: |
          sdk=~/.local/share/solana/install/active_release/bin/platform-tools-sdk/sbf
          # Pinned (the version Agave 3.1.10 uses), with retries: the download can fail transiently.
          for i in 1 2 3 4; do
            [ -x "$sdk/dependencies/platform-tools/llvm/bin/clang" ] && break
            cargo-build-sbf --install-only --tools-version v1.52 || sleep $((i * 15))
          done
          "$sdk/dependencies/platform-tools/llvm/bin/clang" --version | head -1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint # scripts/ typecheck against dist/
      # Determinism across installs and hosts: the programs in test/golden/binaries.json (SBPF v0, and v1 and v2 for
      # four of them) build here, with the platform-tools v1.52 cargo-build-sbf installed above, to the C, IDL and bytes
      # the --docker build container gave (linux/amd64; regenerate with `node scripts/release-manifest.ts --docker …`,
      # see the top of that script). On pushes and pull requests that is the ubuntu-latest runner: the same
      # platform-tools host package (linux-x86_64) as the container, installed independently. macos.yml runs this job
      # on macos-15, where it compares the osx-aarch64 package's builds with the container's.
      - name: Binaries match the build container's
        if: matrix.node == 24
        run: node scripts/release-manifest.ts --check test/golden/binaries.json
      # The tests are only evidence for the toolchain the compiler declares as tested (TESTED_TOOLCHAIN in
      # src/compiler/toolchain.ts): doctor fails here when the installed clang is another one.
      - run: node dist/cli.js doctor
        env:
          TYPESOL_TOOLCHAIN: strict
      - name: Cache third-party program binaries
        # Every fetch-only binary (SOURCES.md's "no (fetch)" rows), keyed on SOURCES.md: a recorded hash that changes
        # fetches again instead of restoring the old file.
        uses: actions/cache@v6
        with:
          path: |
            test/programs/mpl_token_metadata.so
            test/programs/mpl_core.so
            test/programs/mpl_account_compression.so
            test/programs/mpl_noop.so
            test/programs/mpl_bubblegum.so
            test/programs/kamino_lending.so
            test/programs/kamino_farms.so
            test/programs/juplend_earn.so
            test/programs/juplend_liquidity.so
            test/programs/juplend_rewards.so
            test/programs/merkle_distributor.so
          key: programs-v2-${{ hashFiles('test/programs/SOURCES.md') }}
      - name: Fetch program binaries (public devnet, with retries)
        # The step fails when the last attempt does (the loop alone would end with sleep's status). Exit code 3 is a
        # binary whose sha256 is not the one SOURCES.md records: not retried, it fails the run.
        run: |
          for i in 1 2 3; do
            if bash scripts/fetch-programs.sh devnet; then break; else status=$?; fi
            if [ "$status" = 3 ]; then echo "a binary differs from test/programs/SOURCES.md (see above)" >&2; exit 3; fi
            if [ "$i" = 3 ]; then echo "fetching the program binaries failed 3 times" >&2; exit 1; fi
            sleep 20
          done
          test -f test/programs/mpl_token_metadata.so
      # The compiler's own tests; the ports checked against mainnet binaries run in the showcase job.
      # CI_REQUIRE_ALL: a suite whose binary is missing fails instead of skipping (test/binaries.ts).
      - run: pnpm test:core
        env:
          CI_REQUIRE_ALL: programs
      - name: Pack, install the tarball into a scaffolded project, typecheck and test it
        run: |
          npm pack --pack-destination /tmp
          mkdir /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install /tmp/typesol-cli-*.tgz
          npx --no-install typesol --version
          npx --no-install typesol init app --name app && cd app
          npm pkg set devDependencies.typesol=file:$(ls /tmp/typesol-cli-*.tgz)
          npm install
          npx --no-install typesol build
          npx tsc -p tsconfig.json
          npm test

  showcase:
    # The ports under showcase/: Raydium, Jito, Marginfi and coral-xyz/multisig against their mainnet binaries
    # (test/programs), with their fuzzers, and the program-examples ports.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Agave CLI and platform-tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: agave-3.1.10-tools-${{ runner.os }}
      - name: Install Agave CLI
        run: |
          [ -x ~/.local/share/solana/install/active_release/bin/solana ] || sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install platform-tools (the clang TypeSOL compiles with)
        run: |
          sdk=~/.local/share/solana/install/active_release/bin/platform-tools-sdk/sbf
          for i in 1 2 3 4; do
            [ -x "$sdk/dependencies/platform-tools/llvm/bin/clang" ] && break
            cargo-build-sbf --install-only --tools-version v1.52 || sleep $((i * 15))
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache third-party program binaries
        # Every fetch-only binary (SOURCES.md's "no (fetch)" rows), keyed on SOURCES.md: a recorded hash that changes
        # fetches again instead of restoring the old file.
        uses: actions/cache@v6
        with:
          path: |
            test/programs/mpl_token_metadata.so
            test/programs/mpl_core.so
            test/programs/mpl_account_compression.so
            test/programs/mpl_noop.so
            test/programs/mpl_bubblegum.so
            test/programs/kamino_lending.so
            test/programs/kamino_farms.so
            test/programs/juplend_earn.so
            test/programs/juplend_liquidity.so
            test/programs/juplend_rewards.so
            test/programs/merkle_distributor.so
          key: programs-v2-${{ hashFiles('test/programs/SOURCES.md') }}
      - name: Fetch program binaries (public devnet, with retries)
        # The step fails when the last attempt does (the loop alone would end with sleep's status). Exit code 3 is a
        # binary whose sha256 is not the one SOURCES.md records: not retried, it fails the run.
        run: |
          for i in 1 2 3; do
            if bash scripts/fetch-programs.sh devnet; then break; else status=$?; fi
            if [ "$status" = 3 ]; then echo "a binary differs from test/programs/SOURCES.md (see above)" >&2; exit 3; fi
            if [ "$i" = 3 ]; then echo "fetching the program binaries failed 3 times" >&2; exit 1; fi
            sleep 20
          done
          test -f test/programs/mpl_token_metadata.so
      - run: pnpm test:showcase
        env:
          CI_REQUIRE_ALL: programs

  differential:
    # A string, not a boolean: GitHub compares a missing input (null) as equal to false, which would skip this job on
    # pushes and pull requests.
    if: ${{ inputs.differential != 'no' }}
    # The Anchor programs (test/anchor-twins) make test/verification/differential.test.ts, the cpigen Anchor test, the @layout borsh
    # comparison (test/language/borsh-layout.test.ts) and the zero-copy client test (test/client/client-anchor.test.ts) run instead of skip.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Agave CLI, platform-tools and cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.cargo/registry
            test/anchor-twins/target
          key: differential-agave-3.1.10-${{ hashFiles('test/anchor-twins/Cargo.lock') }}
      - run: |
          [ -x ~/.local/share/solana/install/active_release/bin/solana ] || sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:twins
      - run: FUZZ_RUNS=500 FUZZ_STEPS=300 pnpm vitest run test/verification/differential.test.ts test/client/cpigen.test.ts test/language/borsh-layout.test.ts test/client/client-anchor.test.ts
        env:
          CI_REQUIRE_ALL: twins
